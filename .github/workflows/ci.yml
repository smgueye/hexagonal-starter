name: Service Catalogue (CI) # [WORKFLOW]

on: # [EVENEMENT]
  push:

  # A decommenter une fois tout le workflow pret.
  # push:
  #  branches:
  #    - master

  # pull_request:
  #  branches:
  #    - master

  workflow_dispatch: # Mannuel


# Le workflow ne doit pas pouvoir écrire
permissions:
  contents: read

# En cas de nouveau push sur la meme branche, annuler celle en cours.
concurrency:
  group: java-ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true


jobs: # [JOBS]
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout du dépot # 1. Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21 # 2. Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Versions des outils
        run: |
          java --version
          ./mvnw --version

      - name: Verification maven # 3. Maven verify / construction du jar
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: La version du projet
        id: version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload application JAR # 4. Github action artefact
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-service-${{ steps.version.outputs.version }}
          path: compositionroot/target/catalogue-service-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 7

      - name: Charger le rapport de tests échoués
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-de-tests-${{github.run_id}}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: 'ignore'
          retention-days: 7
