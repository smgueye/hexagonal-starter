name: Service Catalogue (CI) # [WORKFLOW]

on: # [EVENEMENT]
  push:
  workflow_dispatch: # Mannuel

# Le workflow ne doit pas pouvoir écrire
permissions:
  contents: read

# En cas de nouveau push sur la meme branche, annuler celle en cours.
concurrency:
  group: java-ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true


jobs: # [JOBS]
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout du dépot
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Version de la stack
        run: |
          java --version
          ./mvnw --version

      - name: Vérifier le projet
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Charger le rapport de tests échoués
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-de-tests-${{github.run_id}}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: 'ignore'
          retention-days: 7
