spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogue_service
    username: ${CATALOGUE_DB_USER}
    password: ${CATALOGUE_DB_PASSWORD}

    hikari:
      pool-name: postgres-catalogue-service
      maximum-pool-size: 10 # pk ?
      connection-timeout: 3000 # pk ?

  jpa:
    properties:
      jakarta:
        persistence:
          validation:
            mode: none
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          jdbc:
            time_zone=UTC
    open-in-view: false

  liquibase:
    enabled: true
    change-log:
      classpath:db/changelog/db.changelog-master.xml
